<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070d1b"><title>Booze赛车城 · 天穹环线</title><link rel="stylesheet" href="racing.css"></head>
<body><main id="race-world" aria-label="Booze赛车城三维赛道" tabindex="0"></main>
<div class="vignette"></div>
<header><a href="index.html" class="city-name">B<span>BOOZE<small>赛车城 / 天穹环线</small></span></a><div class="top-tools"><button id="cruise" aria-pressed="false" title="保持油门，刹车或倒车取消">巡航油门</button><button id="quality" aria-label="切换画质">画质 · 均衡</button><button id="camera">切换视角</button><button id="pause">暂停</button><a href="index.html">返回街区 ↗</a></div></header>
<section id="race-start"><div class="kicker">高空磁驱竞速 · 单人自由试跑</div><h1>天穹<span>环线</span></h1><p>云海之上，重力之外。</p><div class="route-meta"><b id="track-length">—</b><span>玉衡 · 竞速原型</span></div><button id="start" disabled>正在连接赛车城…</button><div id="load-status" role="status">载入赛道与车辆</div></section>
<section id="race-hud" hidden aria-label="驾驶仪表"><div class="lap"><small>当前圈</small><strong id="lap">01</strong><span id="checkpoint">检查点 0 / 3</span></div><div class="timing"><small>本圈计时</small><b id="timer">00:00.00</b><span id="best">最佳 —</span></div><div class="speed"><b id="speed">000</b><span>公里 / 时</span><div class="boost-track"><i id="boost"></i></div><small id="drive-state">磁驱待命</small></div><canvas id="race-map" width="220" height="180" aria-label="赛道地图"></canvas><div class="keys">W / ↑ 前进　S / ↓ 倒车　A D 转向　空格 刹车　Ctrl 漂移　Shift 氮气　R 重生　C 视角</div></section>
<section id="paused" hidden><h2>已暂停</h2><button id="resume">继续驾驶</button><button id="restart">返回发车位</button></section><div id="race-toast" role="status"></div><div id="race-error" hidden role="alert">赛车场未能载入。<button onclick="location.reload()">重新连接</button></div>

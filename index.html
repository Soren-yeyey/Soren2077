<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜班 SOLITUDE</title>
<style>
/* ==========================================================================
   夜班 SOLITUDE —— 单文件 MVP
   Day 7：能启动的页面骨架 + AIGC 素材 + 三个可互动物件
   Day 8：新增「进店前」的街景首页（场景 / 人物 / 故事 / 动态 / 可互动）
          首页列表由本地假数据渲染，并补齐 加载 / 空 / 错误 / 正常 四态
   分区：① 基础 ② 首页（街景） ③ 舞台与场景 ④ 角色 ⑤ 可互动物件
         ⑥ 剧情卡片 ⑦ 进度提示 ⑧ 结束画面
   载体与项目结构见 TECH_DESIGN.md 1.1 / 第 2 节
   舞台内的元素随舞台等比缩放；文字层（首页列表 / 卡片 / 进度 / 结束）用视口单位，手机上才读得清
   ========================================================================== */

/* ---------- ① 基础 ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 手机上用 dvh 更准（避开地址栏高度），不支持的浏览器自动退回 vh */
:root { --vh: 100vh; }
@supports (height: 100dvh) { :root { --vh: 100dvh; } }

html, body {
  height: var(--vh);
  overflow: hidden;              /* 任何屏幕都不出现滚动条（PRD 验收第 6 条） */
  background: #05060c;
  color: #e9edff;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;    /* 关掉双击缩放，点击更跟手 */
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ---------- ② 舞台与场景 ---------- */
/* 全屏垫底：把当前那一屏的图放大、模糊、压暗，铺满整个视口。
   作用只有一个 —— 非 16:9 屏幕上那圈留白不再是纯黑，而是一圈有质感的氛围边框。
   手机竖屏 390x844 实测：舞台只有 390x219，不铺这层就是上下各 312px 的黑板（Day 7 第 4 步拍板）。
   放在 body 第一个子元素且不给 z-index —— 与 #stage 同处"定位元素"层，靠 DOM 顺序垫在它下面 */
.backdrop {
  position: fixed;
  inset: -8%;                    /* 向外多留一圈，模糊边缘才不会露出透明缝 */
  background: url("images/home-street.webp") center / cover no-repeat #05060c;
  filter: blur(26px) brightness(.42) saturate(1.15);
  pointer-events: none;          /* 纯装饰层，不放行任何点击 */
}
/* 进店后由 JS 把这层换成洗衣店那张图（两屏各配各的底） */

/* ---------- ② 首页（街景）---------- */
/* 「进店前」这一屏：场景 / 人物 / 故事 / 动态 / 可互动。
   与店内同样用 16:9 舞台 —— 只有图上的百分比位置与热区能严格对应；
   非 16:9 屏幕多出来的留白仍由 .backdrop 填（Day 8 拍板：外霓虹、内暖光） */
#home {
  position: fixed;
  inset: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .8s ease, visibility .8s;
}
#home.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

#homeStage {
  position: relative;
  aspect-ratio: 16 / 9;
  width: min(100vw, calc(var(--vh) * 16 / 9));
  overflow: hidden;
  cursor: crosshair;
}

.home-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* 雨：斜细线整体缓慢平移 —— 让画面"在动"的最小代价做法。
   调过三次才顺眼：间隔 7px/亮度 .15 时糊成一层灰网；12px 时仍像纱窗。
   现在 20px 起，并加一道纵向遮罩 —— 近处（画面下半）雨清、远处（上半）雨淡，
   这样才有纵深，不然连最远的楼都挂着雨丝，一眼假 */
.home-rain {
  position: absolute;
  inset: -22% -6%;
  background-image:
    repeating-linear-gradient(104deg, rgba(196, 224, 255, .070) 0 1px, transparent 1px 20px),
    repeating-linear-gradient(104deg, rgba(196, 224, 255, .030) 0 1px, transparent 1px 58px);
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, .28) 32%, #000 64%, #000 100%);
  mask-image: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, .28) 32%, #000 64%, #000 100%);
  mix-blend-mode: screen;
  pointer-events: none;
  animation: rainfall 1.3s linear infinite;
}
@keyframes rainfall {
  from { transform: translateY(-6%); }
  to   { transform: translateY(6%); }
}

/* 上下压暗：顶部标题与底部列表在任何画面上都读得清 */
.home-scrim {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(4, 5, 11, .84) 0%, rgba(4, 5, 11, 0) 28%),
    linear-gradient(0deg,   rgba(4, 5, 11, .70) 0%, rgba(4, 5, 11, 0) 34%);
  pointer-events: none;
}

/* 顶栏：作品名 + 氛围文案（原来在开场页，Day 8 迁到这里） */
.home-top {
  position: absolute;
  left: 0; right: 0; top: 0;
  padding: clamp(14px, 3vh, 34px) clamp(16px, 4vw, 56px);
  pointer-events: none;
}
.home-top .eyebrow {
  font-size: clamp(9px, 1.4vw, 12px);
  letter-spacing: .34em;
  color: rgba(160, 200, 255, .70);
}
.home-top h1 {
  margin-top: .42em;
  font-size: clamp(20px, 3.6vw, 44px);
  font-weight: 600;
  letter-spacing: .2em;
  color: #f2f6ff;
  animation: neonPulse 4.2s ease-in-out infinite;
}
/* 后半截走霓虹渐变字 —— 蓝紫黑基调里的那点"亮" */
.home-top h1 em {
  font-style: normal;
  background: linear-gradient(92deg, #6ee2ff 0%, #a06bff 52%, #ff5ea8 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
@keyframes neonPulse {
  0%, 100% { text-shadow: 0 0 22px rgba(110, 226, 255, .46), 0 0 56px rgba(160, 107, 255, .30); }
  50%      { text-shadow: 0 0 36px rgba(110, 226, 255, .78), 0 0 84px rgba(255, 94, 168, .42); }
}
.home-top .tagline {
  margin-top: .7em;
  font-size: clamp(11px, 1.7vw, 15px);
  letter-spacing: .14em;
  color: #a7b8dd;
}

/* 首页角色：与店内同一套百分比定位，只是可站立范围不同（右边避开店门、下边避开列表）。
   idleFloat 是"怠速微浮"，让他站着也像在呼吸；位移动画仍走 left/top 的 transition。
   3A 走动手感：时长不再写死，由 JS 按"实际走了多远"算出后写进 --walk-dur ——
   固定 .7s 会让挪一小步和穿过整个场景花一样长的时间，速度不一致就是"机械感"的来源 */
#playerHome {
  position: absolute;
  left: 34%;
  top: 74%;
  /* 3E 透视缩放：越靠近画面下方（离观众越近）越大。变量由 JS 按可站立范围归一化后写入。
     用 height 而不是 scale —— scale 已经用于镜像（--face），
     若给 scale 加 transition，转身时会被看成"压扁再展开"的动画 */
  height: calc(26% * var(--p-scale, 1));
  width: auto;
  /* 基础位移必须用独立的 translate 属性，不能用 transform：
     transform 在合成顺序里排在最内层，会被外层的 scale 翻掉 —— translate(-50%) 变成 +50%，
     朝左走时整个人就右偏一个身宽（实测 65px ≈ 5.9% 舞台宽）。translate 排在 scale 外层，不受影响 */
  translate: -50% -100%;
  /* 3B 朝向：--face 为 -1 时水平镜像（向左走）。用独立的 scale 属性、而不是往
     transform 里塞 scaleX() —— 因为 idleFloat 动画会整个覆盖 transform，塞进去会被动画吃掉；
     scale 是独立属性，动画不碰它 */
  scale: var(--face, 1) 1;
  /* height 也走同一条时长：大小与位移必须同步到达，否则"人到了、尺寸还没到" */
  transition: left   var(--walk-dur, .7s) var(--walk-ease, ease-in-out),
              top    var(--walk-dur, .7s) var(--walk-ease, ease-in-out),
              height var(--walk-dur, .7s) var(--walk-ease, ease-in-out);
  /* 3D：只留青色光晕。原来那层黑色 drop-shadow 会跟着呼吸/走动一起升降，
     已由独立的 .p-shadow 接管（见第 ③-0 节） */
  filter: drop-shadow(0 0 18px rgba(110, 226, 255, .48));
  animation: idleFloat 3.6s ease-in-out infinite;
  will-change: left, top;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;          /* 点击穿透到场景，别挡住"点地面走动" */
}
#playerHome.no-transition { transition: none; }
/* 3C：走动中换成走路起伏（停下来由 JS 摘掉这个类，回到 idleFloat 的站立呼吸） */
#playerHome.walking { animation: walkBob .86s ease-in-out infinite; }
/* 基础位移在独立 translate 属性上，所以动画里只写"起伏"本身 ——
   即便动画整个覆盖了 transform，也不会再把角色挪位 */
@keyframes idleFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-1.4%); }
}

/* ---------- 3C 步态：走动时的起伏 + 侧倾 ----------
   一个循环 .86s 里起伏两次（左右脚各一步），幅度 1.1%、侧倾 1.2deg。
   再大就不是走路而是蹦跳了；再小则看不出来。
   站立呼吸（idleFloat）与走路起伏（walkBob）是两套动画，靠 .walking 类互斥切换 ——
   两者都只声明 transform，同时在场会互相覆盖。
   基础位移在独立 translate 属性上，这里不必再自带 —— 顺带一个好处：rotate 会被外层的
   scale 镜像，所以朝左走时身体往另一侧倾，倾斜方向自动跟着朝向走 */
@keyframes walkBob {
  0%   { transform: translateY(0)     rotate(0deg); }
  25%  { transform: translateY(-1.1%) rotate(-1.2deg); }
  50%  { transform: translateY(0)     rotate(0deg); }
  75%  { transform: translateY(-1.1%) rotate(1.2deg); }
  100% { transform: translateY(0)     rotate(0deg); }
}

/* 店门热区：洗衣店的玻璃幕墙那一块（位置由 Day 8 在成品图上标定，见下方百分比） */
.home-door {
  position: absolute;
  left: 52%; top: 50%;
  width: 25%; height: 28%;
  padding: 0 0 8px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(110, 226, 255, .05);
  border: 2px solid rgba(126, 228, 255, .52);
  border-radius: 10px;
  cursor: pointer;
  animation: doorGlow 3.1s ease-in-out infinite;
  transition: transform .22s ease;
}
.home-door span {
  padding: .34em .9em;
  font-size: clamp(9.5px, 1.35vw, 14px);
  letter-spacing: .2em;
  text-indent: .2em;
  color: #dff8ff;
  background: rgba(4, 9, 18, .62);
  border-radius: 999px;
  text-shadow: 0 0 12px rgba(110, 226, 255, .95);
}
@keyframes doorGlow {
  0%, 100% { box-shadow: 0 0 26px rgba(110, 226, 255, .22), inset 0 0 40px rgba(110, 226, 255, .10); }
  50%      { box-shadow: 0 0 46px rgba(110, 226, 255, .58), inset 0 0 62px rgba(160, 107, 255, .24); }
}
@media (hover: hover) {
  .home-door:hover { transform: scale(1.02); }
}
.home-door:focus-visible { outline: 3px solid #8ff0dc; outline-offset: 3px; }

/* 底部面板：今夜街上的动静。列表由 JS 从本地假数据渲染，不是写死在 HTML 里 */
.home-panel {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 7;
  padding: clamp(10px, 1.7vh, 20px) clamp(12px, 3.4vw, 48px) clamp(12px, 2vh, 24px);
  background: linear-gradient(0deg, rgba(3, 4, 10, .95) 0%, rgba(3, 4, 10, .82) 52%, rgba(3, 4, 10, 0) 100%);
  /* 面板顶部是渐变透明的，矩形仍会压住店门底下那一小截。
     若让它接鼠标事件，点在那片"看起来是空的"区域会被吃掉 —— 既进不了店、也不走路。
     所以面板整体不接事件，只把事件还给真正能点的东西（卡片、重试按钮）。 */
  pointer-events: none;
}
.home-panel .note,
.home-panel .retry { pointer-events: auto; }

.panel-head {
  display: flex;
  align-items: baseline;
  gap: .8em;
  margin-bottom: clamp(7px, 1.1vh, 12px);
}
.panel-head h2 {
  font-size: clamp(11px, 1.5vw, 14px);
  font-weight: 500;
  letter-spacing: .22em;
  color: #cfe0ff;
}
.panel-head i {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(110, 226, 255, .55), rgba(160, 107, 255, .28), transparent);
}
.panel-head em {
  font-style: normal;
  font-size: clamp(9px, 1.2vw, 11px);
  letter-spacing: .2em;
  color: #6ee2ff;
}

.card-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 165px), 1fr));
  gap: clamp(7px, 1.1vw, 14px);
  list-style: none;
}

.note {
  max-width: 620px;              /* 面板里恒定只有一条，不限制的话会横跨整个屏幕 */
  padding: .68em .85em .72em;
  border-radius: 10px;
  background: rgba(11, 16, 31, .74);
  border: 1px solid rgba(120, 226, 255, .16);
  border-left: 2px solid rgba(110, 226, 255, .85);
  backdrop-filter: blur(6px);
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
}
.note time {
  display: block;
  font-size: clamp(9.5px, 1.3vw, 12px);
  letter-spacing: .18em;
  color: #6ee2ff;
}
.note p {
  margin-top: .38em;
  font-size: clamp(11px, 1.6vw, 13.5px);
  line-height: 1.62;
  color: #c3d0ee;
}
/* "下一条"是操作提示，不是内容 —— 比正文淡一档，右对齐不抢读 */
.note-next {
  display: block;
  margin-top: .42em;
  font-size: clamp(9.5px, 1.25vw, 11.5px);
  letter-spacing: .16em;
  text-align: right;
  color: rgba(120, 226, 255, .60);
}
@media (hover: hover) {
  .note:hover .note-next { color: #6ee2ff; }
}
@media (hover: hover) {
  .note:hover {
    transform: translateY(-3px);
    background: rgba(16, 23, 44, .86);
    border-color: rgba(120, 226, 255, .50);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .55), 0 0 24px rgba(110, 226, 255, .22);
  }
}
.note:focus-visible { outline: 3px solid #8ff0dc; outline-offset: 2px; }

/* 四态：加载 / 空 / 错误 / 正常。切 data-state 就行，不新增 DOM 分支 */
.panel-state {
  display: none;
  padding: clamp(12px, 2vh, 20px) 1em;
  text-align: center;
  font-size: clamp(11px, 1.6vw, 13.5px);
  letter-spacing: .12em;
  color: #8fa2c4;
  background: rgba(11, 16, 31, .58);
  border: 1px dashed rgba(120, 226, 255, .22);
  border-radius: 10px;
}
.home-panel[data-state="loading"] .card-list,
.home-panel[data-state="empty"]   .card-list,
.home-panel[data-state="error"]   .card-list { display: none; }
.home-panel[data-state="loading"] .panel-state,
.home-panel[data-state="empty"]   .panel-state,
.home-panel[data-state="error"]   .panel-state { display: block; }

/* 加载态：一条来回扫的霓虹线 */
.searchline {
  display: block;
  position: relative;
  height: 2px;
  width: min(60%, 260px);
  margin: 0 auto .9em;
  background: rgba(110, 226, 255, .14);
  border-radius: 2px;
  overflow: hidden;
}
.searchline::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 0;
  width: 38%;
  background: linear-gradient(90deg, transparent, #6ee2ff, transparent);
  animation: scanning 1.25s ease-in-out infinite;
}
@keyframes scanning {
  0%   { transform: translateX(-105%); }
  100% { transform: translateX(275%); }
}

.retry {
  margin-top: .95em;
  padding: .5em 1.6em;
  font-family: inherit;
  font-size: clamp(10.5px, 1.4vw, 13px);
  letter-spacing: .18em;
  text-indent: .18em;
  color: #06121a;
  background: linear-gradient(135deg, #7ff0dc, #57c8ff);
  border: none;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(87, 200, 255, .40);
}

.home-hint {
  margin-top: clamp(7px, 1.1vh, 12px);
  text-align: center;
  font-size: clamp(9.5px, 1.35vw, 12px);
  letter-spacing: .14em;
  color: #6f7fa8;
}

/* 舞台固定 16:9，随屏幕整体放大缩小、比例不变。
   画面里所有元素都用百分比定位 —— 换任何屏幕构图都不跑偏（TECH_DESIGN.md 1.5） */
#stage {
  position: relative;
  aspect-ratio: 16 / 9;
  width: min(100vw, calc(var(--vh) * 16 / 9));
  overflow: hidden;
  background: #0a0d18;
  /* 店内这一屏默认不显示 —— 玩家在首页点店门后才亮起来（Day 8） */
  opacity: 0;
  visibility: hidden;
  transition: opacity .8s ease, visibility .8s;
}
#stage.active { opacity: 1; visibility: visible; }

#scene {
  position: absolute;
  inset: 0;
  cursor: crosshair;
}

/* 背景层：AIGC 素材图（images/scene-laundromat.webp，1920x1080 精确 16:9）。
   object-fit: cover —— 任何屏幕比例都铺满且不变形（TECH_DESIGN.md 3.1） */
.bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* 地面：只叠一层很轻的底部暗角，让角色脚底更"落地"；
   素材自带的霓虹倒影保留，不压暗（Day 7 第 2 步实测调整） */
.floor {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 24%;
  background: linear-gradient(180deg, rgba(6, 9, 18, 0) 0%, rgba(6, 9, 18, .30) 100%);
  pointer-events: none;
}

/* ---------- ③-0 接地阴影（3D）----------
   必须是"独立元素"，不能用 drop-shadow。
   drop-shadow 是贴着立绘的不透明轮廓生成的，并且**跟着元素一起动** —— 角色呼吸上浮、
   走路起伏时它同步升降，看起来像"人背后印了块影"，而不是"踩在地上"。
   所以换成独立椭圆：它有自己的 left/top（与角色同一坐标 = 脚底那一点），但身上不带
   任何浮动动画 —— 角色升起来时它留在地上不动，这才叫接地。
   时长同样读 --walk-dur：影子和人必须同步到达，差一点就会出现"影子先到、人后到"。 */
.p-shadow {
  position: absolute;
  /* 3E：影子必须跟着角色一起缩放（同一个 --p-scale）——
     人变大影子不变，会立刻露出"影子不是他踩的"破绽。
     尺寸写 width/height 而不是 scale：transform 里的 translate(-50%,-50%) 是定位用的，
     改尺寸时百分比自动跟随，椭圆中心仍然钉在脚底那一点 */
  width:  calc(8.5% * var(--p-scale, 1));
  height: calc(3.4% * var(--p-scale, 1));
  transform: translate(-50%, -50%);   /* 椭圆中心 = 脚底接触点 */
  background: radial-gradient(ellipse at center,
              rgba(3, 5, 12, .72) 0%,
              rgba(3, 5, 12, .44) 38%,
              rgba(3, 5, 12, .16) 62%,
              rgba(3, 5, 12, 0)   80%);
  transition: left   var(--walk-dur, .7s) var(--walk-ease, ease-in-out),
              top    var(--walk-dur, .7s) var(--walk-ease, ease-in-out),
              width  var(--walk-dur, .7s) var(--walk-ease, ease-in-out),
              height var(--walk-dur, .7s) var(--walk-ease, ease-in-out);
  pointer-events: none;
}
/* 复位时和角色一起瞬移，否则影子会慢慢飘回起点 */
.p-shadow.no-transition { transition: none; }
/* 初始坐标必须与角色在 CSS 里的默认值一致：绝对定位元素没给 left/top 时会停在
   静态位置（左上），脚本执行前那一瞬影子就会闪在角落里 */
#shadowHome { left: 34%; top: 74%; }
#shadow     { left: 50%; top: 78%; }

/* ---------- ③ 角色 ---------- */
/* left / top 是相对舞台的百分比，指的是"脚底"那一点（TECH_DESIGN.md 3.1）。
   height 给百分比、width:auto —— 角色随舞台等比缩放，绝不被拉变形。
   3A 走动手感：时长由 JS 按距离算出写进 --walk-dur，与首页角色同一套规则 */
#player {
  position: absolute;
  left: 50%;
  top: 78%;
  /* 3E 透视缩放：与首页同一套（变量由 JS 写，原因见 #playerHome） */
  height: calc(26% * var(--p-scale, 1));
  width: auto;
  /* 与首页角色同一套：基础位移走独立的 translate 属性，避免被 scale 翻转（原因见 #playerHome） */
  translate: -50% -100%;
  /* 3B 朝向：与首页角色同一套（--face = 1 朝右 / -1 朝左） */
  scale: var(--face, 1) 1;
  transition: left   var(--walk-dur, .7s) var(--walk-ease, ease-in-out),
              top    var(--walk-dur, .7s) var(--walk-ease, ease-in-out),
              height var(--walk-dur, .7s) var(--walk-ease, ease-in-out);
  /* 3D：只留青色光晕（角色在暗背景里才醒目）。原来那层黑色落地投影已由
     独立的 .p-shadow 接管 —— 它会跟着走路起伏一起动，做不了"接地"这件事 */
  filter: drop-shadow(0 0 16px rgba(110, 226, 255, .40));
  will-change: left, top;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* 结束画面的按钮（原开场页那套已并入首页，顶栏样式见第 ② 节） */
.btn {
  margin-top: .5em;
  padding: .85em 2.8em;
  font-family: inherit;
  font-size: clamp(14px, 2.4vw, 17px);
  letter-spacing: .22em;
  text-indent: .22em;
  color: #06121a;
  background: linear-gradient(135deg, #7ff0dc 0%, #57c8ff 100%);
  border: none;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 0 26px rgba(87, 200, 255, .42);
  transition: transform .18s ease, box-shadow .18s ease;
}
.btn:hover  { transform: translateY(-2px); box-shadow: 0 0 34px rgba(87, 200, 255, .60); }
.btn:active { transform: translateY(0); }

/* ---------- ⑤ 可互动物件 ---------- */
/* left / top 是光圈圆心，相对舞台的百分比。
   Day 7 第 3 步实测标定：① 洗衣机（下排左一那台的门）② 右侧自动贩卖机 ③ 左上架上的老式收音机 */
.hotspot {
  position: absolute;
  width: 9.5%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  padding: 0;                        /* 覆盖 <button> 的默认内边距 */
  background: transparent;           /* 覆盖 <button> 的默认灰底 */
  border-radius: 50%;
  border: 2px solid rgba(152, 240, 255, .72);
  box-shadow: 0 0 16px 3px rgba(110, 226, 255, .52),
              inset 0 0 20px rgba(110, 226, 255, .26);
  cursor: pointer;
  z-index: 2;
  animation: breathe 2.6s ease-in-out infinite;
  transition: opacity .45s ease, transform .25s ease;
}
.hotspot[data-id="washer"]  { left: 37%; top: 56%; }
.hotspot[data-id="vending"] { left: 92%; top: 33%; }
.hotspot[data-id="radio"]   { left: 5%;  top: 21%; }
.hotspot:focus-visible { outline: 3px solid #8ff0dc; outline-offset: 3px; }

@keyframes breathe {
  0%, 100% { opacity: .68; }
  50%      { opacity: 1; }
}

/* 还没轮到的那两幕（Day 9「1A」）：光圈压暗、呼吸放慢 ——
   和"轮到的那一幕"形成亮度对比，玩家一眼知道该点哪个。
   注意必须换一条 keyframes：breathe 自己就在动 opacity，光写 opacity 会被它盖掉。
   仍要可点（点它给一句旁白），所以不能设成 display:none 或 pointer-events:none */
@keyframes breatheDim {
  0%, 100% { opacity: .24; }
  50%      { opacity: .38; }
}
.hotspot.pending { animation: breatheDim 4.4s ease-in-out infinite; }

/* 已读：光圈收起，表示"看过了"（PRD 验收第 4 条）。
   注意仍要可点 —— 再点一次会弹出相同文字，但不再计数 */
.hotspot.read { animation: none; opacity: 0; }

@media (hover: hover) {
  .hotspot:hover { transform: translate(-50%, -50%) scale(1.1); }
}

/* ---------- ⑥ 剧情卡片 ---------- */
/* 放在舞台外面、用视口单位：这样手机上文字不会被"舞台等比缩小"拖到看不清。
   代价是电脑上会盖住舞台底部 —— 读字时本来也不看角色，可以接受 */
#card {
  position: fixed;
  left: 50%;
  bottom: max(3vh, 16px);
  width: min(92vw, 720px);
  /* 第 2 步：76vh → 34vh。卡片从此只占屏幕底部约 1/3，
     上方始终留着角色与三个物件 —— 边读边有画面。
     ⚠️ 76vh 的旧值不是笔误，是 2A/1A 为了"每幕一屏读完"一路抬上去的；
     代价是卡片长到画面正中，把游戏整个盖住（用户实测反馈"文字挡住了画面"）。
     296px 是下限：笔记本 720px 高的窗口下 34vh 只有 245px，
     扣掉图与边距后文字区剩不到两行 —— 那种情况宁可让卡片略高于 1/3。 */
  max-height: max(34vh, 296px);
  overflow: hidden;                  /* 日常不该溢出：文字区自己有 max-height。
                                        这里不能用 auto —— 内容恰好顶到上限时
                                        浏览器会多出一条整卡滚动条，很难看 */
  padding: 1.25em 1.5em;
  border-radius: 14px;
  background: rgba(9, 13, 25, .90);
  border: 1px solid rgba(120, 226, 255, .26);
  box-shadow: 0 20px 55px rgba(0, 0, 0, .70), 0 0 40px rgba(87, 200, 255, .12);
  backdrop-filter: blur(7px);
  opacity: 0;
  transform: translate(-50%, 18px);
  pointer-events: none;              /* 收起状态点不到，点击穿透到场景 */
  transition: opacity .34s ease, transform .34s ease;
  z-index: 20;
}
#card.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

/* 2A：物件特写图（P1 顶部横图）。素材本身就是精确 16:9、容器也用 16:9，
   所以 object-fit: cover 实际不会裁掉任何内容，只作极端情况的兜底。
   aspect-ratio 是"占位"：图还没解码完时卡片高度已经定好，文字不会跳一下 */
#cardImg {
  display: block;
  width: 100%;
  max-width: 240px;             /* 第 2 步：320 → 240。卡片变矮后图必须让位给文字。
                                   240px 对应高 135px，文字区还剩约 100px（3.5 行）。
                                   ⚠️ 别在这里写 flex —— 卡片一旦是 flex column，
                                   本行的 flex-basis:auto 会绕开 aspect-ratio 去取图片的
                                   内在高度，图会被拉成竖的（实测 380×460）。 */
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 10px;
  margin: 0 auto 1.05em;        /* 宽度受限时居中 */
  background: #070b16;          /* 图未到时的底色，避免透出卡片背后的画面 */
  opacity: 0;
  transition: opacity .45s ease;
}
#cardImg.ready { opacity: 1; }
#cardImg[hidden] { display: none; }   /* 首页"街上的动静"没有配图，不能占位 */

#cardText {
  font-size: clamp(13.5px, 2.3vw, 17px);
  line-height: 1.7;             /* 1A：1.85 → 1.7。中文在 1.7 行高下依然舒展，
                                   换来的高度正好装下第 3 幕那 6 段 */
  letter-spacing: .04em;
  color: #dde5ff;
  /* 1A：文字区自己限高、超出才滚 —— 于是图固定可见，滚的只有字。
     用 vh 算而不是 flex:1，是为了不让图片被 flex 主轴计算带偏（图必须保持 16:9）。
     195px = 图(135) + 图下边距(17) + 卡片上下 padding(40) + 3px 余量。
     第 2 步：随卡片一起从 76vh 收到 34vh —— 卡片变矮，文字区必须同步收，
     否则文字会顶破卡片高度、被 overflow:hidden 整块截掉。 */
  max-height: calc(max(34vh, 296px) - 195px);
  overflow-y: auto;
  scroll-behavior: smooth;      /* 第 3 步：新浮现的句子滚进视野时是滑过去的，不是跳的。
                                   浏览器不支持时退化为瞬时跳，功能不受影响 */
  padding-right: .2em;          /* 留一点缝，滚动条不压字 */
}
#cardText p + p { margin-top: .6em; }

/* 第 3 步：剧情逐句浮现 —— 段落初始"透明 + 略微下沉"，JS 按 0.8s 间隔加 .on 淡入。
   ⚠️ 只给 .reveal 加初始隐藏，不要写成 `#cardText p { opacity: 0 }`：
   旁白和首页动静的段落也走同一条渲染路径，那样会让"点了没反应"的错觉重现。
   时长 .5s < 间隔 .8s，所以每句都落定了下一句才起，有说话的呼吸感 */
#cardText p.reveal {
  opacity: 0;
  transform: translateY(7px);
  transition: opacity .5s ease, transform .5s ease;
}
#cardText p.reveal.on { opacity: 1; transform: none; }

/* 无障碍：系统开了"减弱动态效果"就不逐句，直接全显 */
@media (prefers-reduced-motion: reduce) {
  #cardText p.reveal { opacity: 1; transform: none; transition: none; }
}

#cardText::-webkit-scrollbar { width: 6px; }
#cardText::-webkit-scrollbar-thumb {
  background: rgba(120, 226, 255, .28);
  border-radius: 3px;
}

/* 矮视口降级：横屏手机 / 极扁窗口。
   上下都不够用时，296px 的下限会把卡片顶到全屏 75.6%（实测 844×390），
   三个物件全被盖住 —— 那就退化成"读字优先"：
   ① 藏掉配图（舞台本身只剩 ~220px 高，图在这里没意义，腾出的 152px 全给文字）
   ② 卡片回到视口高度主导，不再走 296px 下限 */
@media (max-height: 520px) {
  #card { max-height: 38vh; }
  #cardImg { display: none !important; }
  #cardText { max-height: calc(38vh - 40px); }   /* 40px = 卡片上下 padding */
}

/* ---------- ⑦ 进度提示 ---------- */
#progress {
  position: fixed;
  top: 16px;
  right: 16px;
  padding: .55em 1em;
  font-size: clamp(12px, 1.9vw, 15px);
  letter-spacing: .12em;
  color: #a8bcdd;
  background: rgba(8, 12, 24, .62);
  border: 1px solid rgba(120, 226, 255, .22);
  border-radius: 999px;
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .45s ease;
  z-index: 8;
}
#progress.show { opacity: 1; }
#progress b { color: #8ff0dc; font-weight: 600; }

/* ---------- ⑧ 结束画面 ---------- */
/* 全屏盖住一切，只留「再来一次」（PRD 验收第 11 条）。
   盖上之后不再靠 pointer-events 单项屏蔽，而是用 state.over 让点击逻辑整体失效 —— 更可靠 */
#ending {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5em;
  padding: 9vw;
  text-align: center;
  background: radial-gradient(circle at 50% 45%, rgba(19, 29, 51, .95) 0%, rgba(5, 6, 12, .985) 72%);
  opacity: 0;
  pointer-events: none;
  transition: opacity .9s ease;      /* "画面渐暗"（PRD 第 4 节第 5 步） */
}
#ending.show { opacity: 1; pointer-events: auto; }

#ending h2 {
  font-size: clamp(21px, 5vw, 40px);
  font-weight: 600;
  letter-spacing: .22em;
  text-indent: .22em;
  color: #eef3ff;
  text-shadow: 0 0 24px rgba(120, 226, 255, .34);
}

#ending .closing {
  max-width: 30em;
  font-size: clamp(13px, 2.3vw, 17px);
  line-height: 1.9;
  letter-spacing: .05em;
  color: #a9b8dc;
}

/* 复位时临时关掉角色位移动画，避免"再来一次"后看见他慢慢走回中间 */
#player.no-transition { transition: none; }
/* 3C：店内角色没有站立呼吸，只有走动时才戴上这个类（与首页共用同一套 walkBob） */
#player.walking { animation: walkBob .86s ease-in-out infinite; }
</style>
</head>
<body>

<!-- 全屏垫底：只负责把留白填成氛围，不参与任何交互（见 CSS 第 ② 节） -->
<div class="backdrop" aria-hidden="true"></div>

<!-- 舞台：整幅画面都在这里面，所有元素用百分比定位 -->
<div id="stage">
  <div id="scene">
    <img class="bg" src="images/scene-laundromat.webp" alt="" decoding="async">
    <div class="floor"></div>

    <!-- 接地影子：3D。必须放在角色之前（DOM 顺序 = 绘制层级，影子在脚下） -->
    <div class="p-shadow" id="shadow" aria-hidden="true"></div>

    <!-- 角色：AIGC 立绘，脚底对齐 left/top 所指的那一点 -->
    <img id="player" src="images/player-neon.webp" alt="当班的你" decoding="async">

    <!-- 三个可互动物件。放在角色之后，光圈才能盖在角色上面；位置见 CSS 第 ⑤ 节 -->
    <button class="hotspot" type="button" data-id="washer"  aria-label="还在转的洗衣机"></button>
    <button class="hotspot" type="button" data-id="vending" aria-label="自动贩卖机"></button>
    <button class="hotspot" type="button" data-id="radio"   aria-label="老式收音机"></button>
  </div>
</div>

<!-- 进度提示：让玩家知道有目标、还差几个（PRD 第 8 节未决问题 #3，Day 7 拍板"做"） -->
<div id="progress">已读到 <b id="foundCount">0</b> / 3 幕</div>

<!-- 剧情卡片：点物件浮出，点卡片外任意处收起（PRD 第 4 节第 4 步） -->
<div id="card"><img id="cardImg" alt="" decoding="async" hidden><div id="cardText"></div></div>

<!-- 首页：进店前的霓虹街景（Day 8）。
     场景 / 人物 / 故事 / 动态 / 可互动都在这一屏；底部列表由 JS 从本地假数据渲染 -->
<div id="home">
  <div id="homeStage">
    <img class="home-bg" id="homeBg" src="images/home-street.webp" alt="雨夜的霓虹街口" decoding="async">
    <div class="home-rain" aria-hidden="true"></div>

    <!-- 接地影子：与店内同一套（3D） -->
    <div class="p-shadow" id="shadowHome" aria-hidden="true"></div>

    <!-- 人物：与店内同一套百分比定位 -->
    <img id="playerHome" src="images/player-neon.webp" alt="当班的你" decoding="async">

    <!-- 店门：热区位置在成品图上标定（洗衣店的玻璃幕墙那一块） -->
    <button class="home-door" id="doorBtn" type="button" aria-label="推门进洗衣店">
      <span>推门进去</span>
    </button>
  </div>

  <!-- 上下压暗层：保证顶部标题与底部列表在任何画面上都读得清 -->
  <div class="home-scrim" aria-hidden="true"></div>

  <!-- 顶栏：作品名与氛围文案（原来在开场页，Day 8 迁到这里） -->
  <div class="home-top">
    <p class="eyebrow">交互式短篇 · 第 01 夜</p>
    <h1>夜班 <em>SOLITUDE</em></h1>
    <p class="tagline">凌晨三点，雨还没停。洗衣店的灯还亮着。</p>
  </div>

  <!-- 今夜街上的动静 —— 列表由 JS 渲染；data-state 管 加载 / 空 / 错误 / 正常 -->
  <section class="home-panel" id="homePanel" data-state="loading">
    <div class="panel-head">
      <h2>今夜街上的动静</h2>
      <i></i>
      <em id="noteStamp"></em>
    </div>
    <ul class="card-list" id="homeList"></ul>
    <div class="panel-state" id="homeState"></div>
    <p class="home-hint">点地面走动 · 点动静卡片看下一条 · 点店门进店</p>
  </section>
</div>

<!-- 结束画面：全屏，只保留「再来一次」（PRD 第 4 节第 5 步 / 验收第 11 条） -->
<div id="ending">
  <h2>天快亮了</h2>
  <p class="closing">雨小了。卷帘门拉下来，该收工了。<br><br>
    那件外套还在 3 号机里转。天亮以后我会把它取出来，叠好，放进失物柜的第三层——前两次都在那儿。<br><br>
    这店还剩三个月。三个月里的每一个夜班，我都会把灯留着。<br><br>
    亮着，总比黑着强。</p>
  <button id="againBtn" class="btn" type="button">再来一次</button>
</div>

<script>
/* ==========================================================================
   逻辑部分。状态只存在内存里，刷新即归零 —— 见 TECH_DESIGN.md 3.1
   ========================================================================== */
(function () {
  'use strict';

  // 运行时状态：角色当前位置、本次移动的落点，都用相对舞台的百分比
  const state = {
    player: { x: 50, y: 78 },
    target: { x: 50, y: 78 },
    over: false            // 结束画面出现后置 true —— 点地面、点物件全部失效
  };

  // 可站立范围：防止角色走出画面（PRD 验收第 2 条）
  const WALK = { minX: 6, maxX: 94, minY: 58, maxY: 90 };

  const scene  = document.getElementById('scene');
  const player = document.getElementById('player');
  const shadow = document.getElementById('shadow');        // 3D：店内的接地阴影
  const stage  = document.getElementById('stage');

  // 首页（街景）相关元素
  const home       = document.getElementById('home');
  const homeStage  = document.getElementById('homeStage');
  const homeBg     = document.getElementById('homeBg');
  const homePanel  = document.getElementById('homePanel');
  const homeList   = document.getElementById('homeList');
  const homeState  = document.getElementById('homeState');
  const noteStamp  = document.getElementById('noteStamp');
  const playerHome = document.getElementById('playerHome');
  const shadowHome = document.getElementById('shadowHome');   // 3D：街景的接地阴影
  const backdrop   = document.querySelector('.backdrop');

  const clamp = (v, lo, hi) => (v < lo ? lo : (v > hi ? hi : v));

  /* ---- 3D 接地阴影 ----
     影子是独立定位元素，不会自己跟着角色走：角色动、影子不动，一眼就露馅。
     所以凡是要改角色坐标、改过渡时长、改瞬移标记的地方，都得连影子一起处理。
     用一张表把"角色 → 它的影子"记下来，上面那些地方就不用各写一遍 if。 */
  const shadowFor = new WeakMap([[player, shadow], [playerHome, shadowHome]]);

  /* ---- 3A 走动手感：让"远近"的速度一致 ----
     原来 transition 写死 .7s，于是挪一小步和穿过整个场景花一样长的时间 ——
     速度不随距离变化，看上去像在"滑行"而不是在走，这就是机械感的第一来源。
     改成：时长 = 距离 ÷ 步速，再夹在 [最短, 最长] 之间。
     舞台是 16:9，纵向 1% 的物理长度只有横向 1% 的 9/16，
     所以算距离时要把纵向分量换算一次，否则斜着走会偏快。 */
  const WALK_Y_SCALE = 9 / 16;
  const WALK_SPEED   = 30;      // 每秒走 30 个横向百分比：横穿店内约 2.9 秒
  const WALK_MIN_DUR = 0.30;    // 点得再近也要有"挪一步"的过程，不能像瞬移
  const WALK_MAX_DUR = 3.00;    // 点得再远也别让玩家干等
  const WALK_EASE    = 'cubic-bezier(.33, 0, .28, 1)';   // 起步利落、收步柔和

  // 把时长与缓动写进 CSS 变量，交给 #player / #playerHome 的 transition 读取。
  // 用变量而不是直接写 style.transition：行内 transition 会压过 .no-transition，
  // 把"复位时瞬移、不要走回去"的逻辑弄坏。
  function setWalkDur(el, fromX, fromY, toX, toY) {
    const d   = Math.hypot(toX - fromX, (toY - fromY) * WALK_Y_SCALE);
    const dur = clamp(d / WALK_SPEED, WALK_MIN_DUR, WALK_MAX_DUR).toFixed(2);
    // 3D：接地阴影共用同一套时长 —— 差一点就会出现"影子先到、人后到"的错位
    for (const t of [el, shadowFor.get(el)]) {
      if (!t) continue;
      t.style.setProperty('--walk-dur', dur + 's');
      t.style.setProperty('--walk-ease', WALK_EASE);
    }
  }

  /* ---- 3B 朝向：向左走就把立绘水平镜像 ----
     只看这一步的"横向"位移，不看纵向 —— 上下移动不该让人转身。
     位移太小（不足 1.5%）也不翻：那是原地挪一下，翻了反而左右抖。 */
  function setFacing(el, dx) {
    if (Math.abs(dx) < 1.5) return;
    el.style.setProperty('--face', dx < 0 ? '-1' : '1');
  }

  /* ---- 3C 步态：走动过程中换成走路起伏，走完再换回站立呼吸 ----
     用同一套距离算法判断"是不是真的在走"：不足 0.8% 视作原地不动，
     否则点一下脚下就会原地踏步。计时器按元素分开存，两屏角色互不干扰。
     收尾比位移多留 70ms —— 动画若比位移先停，最后一下会显得"僵住"。 */
  const walkTimers = new WeakMap();

  function setGait(el, fromX, fromY, toX, toY) {
    const d   = Math.hypot(toX - fromX, (toY - fromY) * WALK_Y_SCALE);
    const dur = clamp(d / WALK_SPEED, WALK_MIN_DUR, WALK_MAX_DUR);
    clearTimeout(walkTimers.get(el));
    if (d < 0.8) { el.classList.remove('walking'); return; }
    el.classList.add('walking');
    walkTimers.set(el, setTimeout(() => el.classList.remove('walking'), dur * 1000 + 70));
  }

  /* ---- 3E 透视缩放：越靠近画面下方（离观众越近）越大 ----
     按每屏自己的可站立范围归一化：范围中点 = 原始尺寸，上边界最小、下边界最大。
     总幅度 22%（两端各 ±11%）—— 再大角色会"忽大忽小"，再小则看不出来。
     影子共用同一个 --p-scale，必须一起缩放：人变大而影子不变，立刻露出"影子不是他踩的"。 */
  const PERSPECTIVE = 0.22;

  function setPerspective(el, y, walk) {
    const mid  = (walk.minY + walk.maxY) / 2;
    const half = (walk.maxY - walk.minY) / 2;
    const k    = (1 + ((y - mid) / half) * (PERSPECTIVE / 2)).toFixed(3);
    el.style.setProperty('--p-scale', k);
    const sh = shadowFor.get(el);
    if (sh) sh.style.setProperty('--p-scale', k);
  }

  /* ---- 3D 落位：角色和它的接地阴影必须写同一个坐标 ----
     拆成函数是因为两屏都要用，而且"影子忘了同步"是这类改动的经典 bug ——
     集中在出入口写一次，以后加角色也不用再想这件事。
     walk 传该屏自己的可站立范围，用来算 3E 的透视大小。 */
  function placeWithShadow(el, x, y, walk) {
    el.style.left = x + '%';
    el.style.top  = y + '%';
    setPerspective(el, y, walk);       // 3E：越靠下（越近）越大
    const sh = shadowFor.get(el);
    if (sh) {
      sh.style.left = x + '%';
      sh.style.top  = y + '%';
    }
  }

  // 3D：复位时角色"瞬移"归位，影子必须一起瞬移，否则它会慢慢飘回起点
  function setInstant(el, on) {
    el.classList.toggle('no-transition', on);
    const sh = shadowFor.get(el);
    if (sh) sh.classList.toggle('no-transition', on);
  }

  // 把角色画到 target 处；位置变化由 CSS transition 补成"走过去"。
  // 3A：先按距离定好这一步的时长再落位 —— 顺序不能反，否则读到的还是上一次的时长
  function renderPlayer() {
    setWalkDur(player, state.player.x, state.player.y, state.target.x, state.target.y);
    setFacing(player, state.target.x - state.player.x);   // 3B：朝左走就镜像（用更新前的旧位置算）
    setGait(player, state.player.x, state.player.y, state.target.x, state.target.y);   // 3C：走动起伏
    placeWithShadow(player, state.target.x, state.target.y, WALK);   // 3D 影子跟随 + 3E 透视大小
    state.player.x = state.target.x;
    state.player.y = state.target.y;
  }

  scene.addEventListener('click', (e) => {
    if (state.over) return;             // 结束后点地面无任何反应（PRD 验收第 11 条）

    const r = scene.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width)  * 100;
    const y = ((e.clientY - r.top)  / r.height) * 100;

    // 先收敛到可站立范围，再移动（点到画面外也不会走出去）
    state.target.x = clamp(x, WALK.minX, WALK.maxX);
    state.target.y = clamp(y, WALK.minY, WALK.maxY);
    renderPlayer();
  });

     第一段只等 60ms —— 卡片本身有 .34s 淡入，第一段跟着它到位，
     于是"点物件 → 立刻有东西出现"，不会又变成"点了没反应"。
     那 60ms 也不是可有可无：段落是刚插进 DOM 的，同一帧内加类浏览器不会走 transition */
  const REVEAL_STEP = 800;        // 段与段的间隔（ms）。三幕各 4–5 段 → 2.4–3.2 秒全出完

  function clearReveal() {

  // 弹出若干行文字，可带一张顶部图 —— 店内剧情与首页动静共用同一张卡片
  function showCard(lines, img) {
    clearReveal();
    cardText.replaceChildren(...lines.map((line, i) => {
      const p = document.createElement('p');
      p.textContent = line;        // textContent：文案里的引号、破折号原样显示，也不会被当成标签
      p.className = 'reveal';
      revealTimers.push(setTimeout(() => {
        p.classList.add('on');
        // 卡片现在只占屏幕底部 1/3（第 2 步），长段落必会超出可视区：
        // 让新浮现的那句滚进视野。滚"刚够看见这句"的距离，不是一路滚到底 ——
        // 否则每出一句就把玩家正在读的前文往上推走。已经看得见时不动
        const overflow = p.getBoundingClientRect().bottom - cardText.getBoundingClientRect().bottom;
        if (overflow > 0) cardText.scrollTop += overflow + 8;
      }, 60 + i * REVEAL_STEP));
      return p;
    }));

      }

  }

  }

  function problemNode(msg, canRetry) {
    const box = document.createElement('div');
    box.append(document.createTextNode(msg));
    if (canRetry) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'retry';
      btn.textContent = '重新连接';
      btn.addEventListener('click', (e) => { e.stopPropagation(); loadNotes(); });
      box.append(document.createElement('br'), btn);
    }
    return box;
  }

  // ---- 渲染列表：数据 → 卡片。卡片是 JS 现造的，HTML 源码里搜不到这些句子 ----
  // 一次只放一条（2026-09-23 用户反馈：10 条铺满下半屏，把街景和店门整块盖住了）。
  // 10 条内容一条不丢，点卡片轮着看，右上角计数显示"第几条 / 共几条"。
  let noteList = [];
  let noteIndex = 0;

  function renderNotes(list) {
    noteList = list || [];
    noteIndex = 0;
    paintNote();
  }

  function paintNote() {
    if (!noteList.length) {                 // 空态：列表清空，交给 .panel-state 显示文案
      homeList.replaceChildren();
      noteStamp.textContent = '';
      return;
    }
    const n = noteList[noteIndex];
    const li = document.createElement('li');
    li.className = 'note';
    li.tabIndex = 0;
    const t = document.createElement('time');
    t.textContent = n.t;
    const p = document.createElement('p');
    p.textContent = n.s;
    const next = document.createElement('span');
    next.className = 'note-next';
    next.textContent = '下一条 ›';
    li.append(t, p, next);
    const go = (e) => {
      e.stopPropagation();
      noteIndex = (noteIndex + 1) % noteList.length;   // 读完最后一条回到第一条
      paintNote();
    };
    li.addEventListener('click', go);
    li.addEventListener('keydown', (e) => {          // 键盘也能操作（Tab 到卡片后回车）
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(e); }
    });
    homeList.replaceChildren(li);
    noteStamp.textContent = (noteIndex + 1) + ' / ' + noteList.length;
  }

  // 交付用的验证开关（三个非正常态各有稳定入口，不必靠"手快"去抓瞬间）：
  //   ?mock=loading 停在加载态   ?mock=empty 看空态   ?mock=error 看错误态
  //   不加参数 = 正常态：短暂加载后渲染假数据
  const MOCK = new URLSearchParams(location.search).get('mock') || 'ok';
  let loadTimer = null;

  function loadNotes() {
    clearTimeout(loadTimer);
    setPanelState('loading', loadingNode());
    noteStamp.textContent = '';

    if (MOCK === 'loading') return;      // 停在加载态，方便截图与验收

    if (MOCK === 'error') {
      loadTimer = setTimeout(() => {
        setPanelState('error', problemNode('街区信号中断 —— 拿不到今夜的动静。', true));
        noteStamp.textContent = '—';
      }, 700);
      return;
    }
    if (MOCK === 'empty') {
      loadTimer = setTimeout(() => {
        renderNotes([]);
        setPanelState('empty', problemNode('今夜街上没什么动静。', false));
      }, 700);
      return;
    }
    // 正常：短暂加载后把假数据渲染成卡片
    loadTimer = setTimeout(() => {
      renderNotes(NOTES);
      setPanelState('ok');
    }, 900);
  }

  // 场景图挂掉时不能白屏 —— 得让玩家知道发生了什么，并留一个重新连接的入口
  homeBg.addEventListener('error', () => {
    clearTimeout(loadTimer);
    setPanelState('error', problemNode('街区画面加载失败 —— 检查网络或图片路径。', true));
    noteStamp.textContent = '—';
  });

  // ---- 两屏切换：首页 ⇄ 店内 ----
  let inShop = false;

  function enterShop() {
    if (inShop) return;
    inShop = true;
    card.classList.remove('show');
    home.classList.add('hidden');
    stage.classList.add('active');
    progress.classList.add('show');     // 进度提示只在店内有意义
    backdrop.style.backgroundImage = 'url("images/scene-laundromat.webp")';
  }

  function backHome() {
    inShop = false;
    stage.classList.remove('active');
    progress.classList.remove('show');
    home.classList.remove('hidden');
    backdrop.style.backgroundImage = 'url("images/home-street.webp")';

    // 角色瞬移回街上起点：先关位移动画 → 落位 → 强制重排 → 再把动画还回去
    setInstant(playerHome, true);
    renderHomePlayer(34, 74);
    void playerHome.offsetWidth;
    setInstant(playerHome, false);
  }

  // 在街上点地面 → 角色走过去（与店内同一套逻辑，只是可站立范围不同）
  homeStage.addEventListener('click', (e) => {
    const r = homeStage.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width)  * 100;
    const y = ((e.clientY - r.top)  / r.height) * 100;
    // 3A：新目标当参数传进去，让 renderHomePlayer 能拿旧位置算距离
    renderHomePlayer(clamp(x, HOME_WALK.minX, HOME_WALK.maxX),
                     clamp(y, HOME_WALK.minY, HOME_WALK.maxY));
  });

  /* ---------------- 初始化 ---------------- */
  // 包一层瞬移：3E 的 --p-scale 首帧才写入，若不关过渡，开场会看到人物"放大一下"
  setInstant(player, true);
  setInstant(playerHome, true);
  renderPlayer();         // 店内角色首帧落位（同时算出它的透视大小）
  renderHomePlayer();     // 首页角色首帧落位（同时算出它的透视大小）
  void playerHome.offsetWidth;   // 强制重排，让首帧尺寸立即生效
  setInstant(player, false);
  setInstant(playerHome, false);
  loadNotes();            // 首页列表：先加载态，随后渲染假数据
})();
</script>

</body>
</html>
